name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'
  IMAGE_NAME: ghcr.io/${{ github.repository }}
permissions:
  contents: read
  packages: write

jobs:


  # ── Job 1: lint, test, build ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 ./...

      - name: Build
        run: go build ./...

  # ── Job 2: build and push Docker image ────────────────────────────
  build-image:
    needs: test
    runs-on: ubuntu-latest
    # Only push on main; PRs build to verify the Dockerfile works.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:dev .

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:dev

  # ── Job 3: deploy to a kind cluster and verify ────────────────────
  deploy-kind:
    needs: build-image
    # Only deploy on main pushes (not PRs).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:dev

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: shortener-ci
          wait: 60s

      - name: Load image into kind
        run: kind load docker-image ${{ env.IMAGE_NAME }}:dev --name shortener-ci

      - name: Patch image name in manifests
        run: |
          sed -i 's|localhost/shortener-api:dev|${{ env.IMAGE_NAME }}:dev|g' k8s/20-api.yaml k8s/30-worker.yaml k8s/40-grpc.yaml

      - name: Deploy to kind
        run: kubectl apply -f k8s/

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=Ready pod -l app=api -n shortener --timeout=120s
          kubectl wait --for=condition=Ready pod -l app=grpc -n shortener --timeout=120s

      - name: Smoke test
        run: |
          API_POD=$(kubectl get pod -l app=api -n shortener -o jsonpath='{.items[0].metadata.name}')

          echo "=== health ==="
          kubectl exec -n shortener "$API_POD" -- curl -sf http://localhost:3000/healthz
          echo

          echo "=== shorten ==="
          RESP=$(kubectl exec -n shortener "$API_POD" -- curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d '{"url":"https://example.com/ci-smoke-test"}' \
            http://localhost:3000/shorten)
          echo "$RESP"
          CODE=$(echo "$RESP" | grep -o '"code":"[^"]*"' | cut -d'"' -f4)

          echo "=== redirect ==="
          kubectl exec -n shortener "$API_POD" -- curl -s -o /dev/null \
            -w "%{http_code}" http://localhost:3000/$CODE
          echo

          echo "=== grpc health (tcp) ==="
          GRPC_POD=$(kubectl get pod -l app=grpc -n shortener -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n shortener "$GRPC_POD" -- sh -c 'echo > /dev/tcp/localhost/50051 && echo "grpc port open"'