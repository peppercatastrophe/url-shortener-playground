services:
  db:
    image: postgres:16-alpine
    container_name: shortener-db
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - shortener-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: shortener-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shortener-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
  grpc:
    build: .
    container_name: shortener-grpc
    command: ["/usr/local/bin/grpc"]
    environment:
      DATABASE_URL: "postgres://shortener:shortener@db:5432/shortener?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_ADDR: "amqp://guest:guest@rabbitmq:5672/"
      GRPC_ADDR: ":50051"
      GRPC_AUTH_TOKEN: "shortener-secret-token"
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  shortener-data: