apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: localhost/shortener-api:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/api"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: shortener-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-secret
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://shortener:$(POSTGRES_PASSWORD)@postgres:5432/shortener?sslmode=disable"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shortener
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
