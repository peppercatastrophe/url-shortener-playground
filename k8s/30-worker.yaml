apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: localhost/shortener-api:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/worker"]
          envFrom:
            - configMapRef:
                name: shortener-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-secret
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://shortener:$(POSTGRES_PASSWORD)@postgres:5432/shortener?sslmode=disable"
