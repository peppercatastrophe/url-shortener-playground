apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "shortener"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: "shortener"
          volumeMounts:
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shortener"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: schema
          configMap:
            name: postgres-schema
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shortener
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
